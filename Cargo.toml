[package]
name = "si-opencode-updater"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "si_opencode_updater"
path = "src/bin/updater.rs"

[dependencies]
base64 = "0.22"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2" }
