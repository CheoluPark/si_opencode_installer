<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SI OpenCode 업데이트</title>
<style>
body{margin:0;background:#10131a;color:#e8edf7;font:15px/1.6 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:32px}h1{margin:0 0 4px}#summary{color:#b8c2d6;margin-bottom:28px}.item{border-top:1px solid #293043;padding:20px 0}.item img{display:block;max-width:100%;max-height:360px;margin-top:12px;border-radius:8px}a{color:#91caff}button{float:right;background:#4b8df8;color:white;border:0;border-radius:6px;padding:9px 20px;font-weight:600;cursor:pointer}
</style>
<main><button id="close">확인</button><h1 id="title"></h1><p id="summary"></p><section id="items"></section></main>
<script>
const invoke=window.__TAURI__.core.invoke;
invoke('release_notes').then(notes=>{
  title.textContent=notes.title; summary.textContent=notes.summary;
  for(const item of notes.items){const el=document.createElement('article');el.className='item';const h=document.createElement('h2');h.textContent=item.title;el.append(h);const p=document.createElement('p');p.textContent=item.body;el.append(p);if(item.image){const img=document.createElement('img');img.src=item.image;img.alt=item.title;el.append(img)}if(item.url){const a=document.createElement('a');a.href=item.url;a.target='_blank';a.rel='noreferrer';a.textContent='도움말 열기';el.append(a)}items.append(el)}
});
close.onclick=()=>window.__TAURI__.window.getCurrentWindow().close();
</script>
</html>
